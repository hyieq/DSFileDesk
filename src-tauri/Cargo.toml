[package]
name = "filedesk"
version = "0.4.0"
description = "Synology desktop file manager"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
walkdir = "2"
base64 = "0.22"
libloading = "0.8"
axum = "0.8"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
drag = "2.1"

[dependencies.md5]
version = '0.7'
